# Homepage hero + landing content.
# Edit freely — consumed by layouts/index.html. No template changes needed.
# `make check-positioning` reads this file too: see the notes on whoami and on
# the stats band for the two things it will not let you change silently.

# Short identity shown in the poster hero.
name = "Daniel Luca"
headline = "I build tools for developers—and investigate how systems break."
nickname = "CleanUnicorn"
# Printed as the output of `~$ whoami` in the hero terminal eyebrow. This is
# WHO he is — traits only. WHAT he does (roles, employers) is the `subtitle`
# in hugo.toml, rendered under the name; `make check-positioning` fails if a
# role word or an employer leaks into this line.
whoami = "builder · hacker · extropian"
# Optional: turns the matching phrase inside `whoami` into a link. The template
# replaces every match and treats this as a regex, so the phrase must occur in
# `whoami` exactly once and carry no regex metacharacter — enforced by
# `make check-positioning`.
whoamiLink = "builder"
whoamiURL = "/projects/"

# Portrait shown in the hero. Lives in static/images/.
photo = "/images/daniel-luca.jpg"
photoAlt = "Daniel Luca"

# CV link at the right of the "How I can help" heading, above the cards. Kept out
# of [[cta]] on purpose: the card grid is tuned for two or three cards
# (assets/css/z-home.css:99), and a fourth would sit alone on its own row.
# Top-level keys, so they must stay above the first [table]. Remove cvURL to
# drop the link.
cvURL = "/cv.pdf"
cvLabel = "Download CV (PDF)"

# Credibility strip — framed honestly: what I've built, protocols audited, firms
# advised, where the work has been featured. Edit freely.
[proof]
label = "Engineering and security work"
items = [
  { text = "Built the RL-Swarm contracts for Gensyn's first public launch", url = "https://github.com/gensyn-ai/rl-swarm-contracts" },
  { text = "Audited Uniswap, Aave, Filecoin and Polygon at ConsenSys Diligence", url = "/work/#security-researcher-consensys-diligence" },
  { text = "Presented security research at DEF CON 27", url = "https://youtu.be/Qd9ubry-c_M" },
]

# "By the numbers" credibility band. Edit the values freely, but keep exactly
# four entries: the band is a 4-column grid (assets/css/z-home.css:62) and
# `make check-positioning` fails on any other count.
[[stats]]
value = "15+"
label = "Open-source projects"
url = "/about/#projects"

[[stats]]
value = "2008"
label = "Shipping software"
url = "/work/"

[[stats]]
value = "8+"
label = "Protocols audited"
url = "/work/#security-researcher-consensys-diligence"

[[stats]]
value = "10+"
label = "Talks & podcasts"
url = "/about/#talks"

[[cta]]
title = "Using one of my tools?"
text = "Bring a bug, a workflow that feels awkward, or an idea for a contribution. Start with the relevant project's repository."
label = "Find the repository"
url = "/projects/"
primary = true

[[cta]]
title = "Working on agents, local inference or smart-contract security?"
text = "Send me a repository, a technical question, or a problem you're trying to solve."
label = "Talk about your project"
url = "/contact/"

# -----------------------------------------------------------------------------
# Connect — personal quick links, front and centre on the homepage. Each entry
# is rendered in the visual style of its network (icons live in
# layouts/partials/brand-icon.html; styling in assets/css/z-connect.css).
# `featured = true` promotes the booking row to the primary call to action.
# The booking link points at a Cal.com 30-minute scheduling page.
# `tagline` feeds the poster hero; `note` introduces the board.
# -----------------------------------------------------------------------------
[connect]
label = "Let's connect"
note = "Send me a repository, a technical question, or a problem you’re trying to solve."
tagline = "Open-source coding agents, local AI infrastructure, and Ethereum security research. Shipping software since 2008."
# Which links are profiles, in the order the footer and the JSON-LD sameAs use
# (layouts/partials/profile-links.html). Each names a `net` below.
profiles = ["x", "linkedin", "github"]

[[connect.links]]
net = "calendar"
label = "Book a meeting"
sub = "cal.com · 30 min"
url = "https://cal.com/daniel-luca-cleanunicorn/30min"
featured = false

[[connect.links]]
net = "telegram"
label = "Telegram"
sub = "@cleanunicorn"
url = "https://t.me/cleanunicorn"

[[connect.links]]
net = "x"
label = "X / Twitter"
sub = "@cleanunicorn"
url = "https://x.com/cleanunicorn"

[[connect.links]]
net = "github"
label = "GitHub"
sub = "cleanunicorn"
url = "https://github.com/cleanunicorn"

[[connect.links]]
net = "linkedin"
label = "LinkedIn"
sub = "Daniel Luca"
url = "https://www.linkedin.com/in/luca-daniel-5227267/"
