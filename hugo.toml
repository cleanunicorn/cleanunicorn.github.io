baseURL = 'https://cleanunicorn.github.io/'
languageCode = 'en-us'
theme = "terminal"
pagination.pagerSize = 5
# No post uses tags or categories; drop the empty taxonomy pages and feeds.
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
enableGitInfo = true

[markup.goldmark.renderer]
  unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        inline = [['$', '$']]
        block = [['$$', '$$']]

[markup.highlight]
  noClasses = false

# Keep processed post images (render-image hook) in --cacheDir so the CI
# cache step reuses them instead of re-encoding every image on each deploy.
[caches.images]
  dir = ':cacheDir/images'

[params]
  contentTypeName = "about"
  showMenuItems = 4
  centerTheme = true
  autoCover = true
  # Optional lede for the custom 404 page (layouts/404.html). Falls back to a
  # built-in message when unset.
  # missingContentMessage = "The page you're looking for isn't on this chain."

[languages]
  [languages.en]
    title = "Daniel Luca"
    languageName = "English"

    [languages.en.params]
      # WHAT he does — roles and output. Rendered under the name in the hero, as the
      # CV subtitle and as the homepage meta description. WHO he is lives in
      # data/home.toml `whoami`.
      subtitle = "CTO @ Stealth Startup | Technical Partner @ Eden Block | Open-source projects"
      menuMore = "Show more"
      keywords = "Daniel Luca, CleanUnicorn, builder, hacker, extropian, software engineer, CTO, open source, developer tools, AI agents, local LLM, smart contract audit, Ethereum security, blockchain security researcher, EVM, Solidity, DeFi, decentralized AI, venture capital"

      # Schema.org Person metadata — consumed by partials/structured_data.html.
      alternateName = "CleanUnicorn"
      jobTitle = "CTO & Technical Partner"
      personDescription = "Builder, hacker and extropian — open-source tools like Earheart and the Agents Library, plus Ethereum smart contracts and security research since 2017. CTO at a stealth startup and Technical Partner at Eden Block."
      # Profiles beyond the X / LinkedIn / GitHub links, which come from
      # data/home.toml `connect.links` via partials/profile-links.html.
      sameAsExtra = ["https://www.imdb.com/title/tt35931420/"]
      knowsAbout = [
        "Software Engineering", "Open Source", "Developer Tooling", "LLM Engineering",
        "Smart Contract Security", "Ethereum", "Solidity", "EVM Internals",
        "DeFi", "Blockchain Security", "Decentralized AI", "Venture Capital",
      ]

      [languages.en.params.twitter]
        site = "@cleanunicorn"
        creator = "@cleanunicorn"

      [languages.en.params.logo]
        logoText = "Daniel Luca"
        logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "work"
        name = "Work"
        url = "/work/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 30
      [[languages.en.menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "/contact/"
        weight = 40
