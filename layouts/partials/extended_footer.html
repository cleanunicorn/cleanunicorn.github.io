<div class="connect-footer">
  <span class="connect-footer__label">Connect</span>
  <ul class="connect-footer__links">
    {{- range partial "profile-links.html" . }}
    <li><a href="{{ .url }}" target="_blank" rel="me noopener">{{ .label }}</a></li>
    {{- end }}
    <li><a href="{{ "contact/" | absLangURL }}">Contact</a></li>
    {{- with site.Home.OutputFormats.Get "rss" }}
    <li><a href="{{ .Permalink }}" type="application/rss+xml">RSS</a></li>
    {{- end }}
  </ul>
</div>
