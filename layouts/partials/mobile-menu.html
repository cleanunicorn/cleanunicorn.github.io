{{- /* Mobile primary navigation. Links remain available when JavaScript is off;
   js/menu.js reveals the button and initializes the list as collapsed. */ -}}
<nav class="navigation-menu navigation-menu--mobile" aria-label="Primary mobile">
  <button class="mobile-nav__toggle" type="button" aria-expanded="true" aria-controls="mobile-nav-links" hidden>Menu <span aria-hidden="true">▾</span></button>
  <ul class="mobile-nav__links" id="mobile-nav-links">
    {{ partial "nav-links.html" . }}
  </ul>
</nav>
