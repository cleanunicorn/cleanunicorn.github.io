<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The software development lifecycle as a loop of six stages: Define, Plan, Build, Verify, Review, Ship</title><rect width="800" height="470" fill="#1a170f"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adaba5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd68a"/></marker></defs><ellipse cx="400" cy="215" rx="280" ry="150" fill="none" stroke="#4a463d" stroke-width="2"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(540.0,85.1) rotate(17.2)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(680.0,215.0) rotate(90.0)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(540.0,344.9) rotate(162.8)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(260.0,344.9) rotate(-162.8)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(120.0,215.0) rotate(-90.0)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(260.0,85.1) rotate(-17.2)"/><rect x="305.0" y="36.0" width="190" height="58" rx="6" fill="#201c13" stroke="#e6c384" stroke-width="1.5"/><text x="400.0" y="61.0" font-size="15" fill="#e6c384" text-anchor="middle" font-weight="700" >1. Define</text><text x="400.0" y="81.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >you</text><rect x="547.4871130596429" y="111.0" width="190" height="58" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="642.4871130596429" y="136.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >2. Plan</text><text x="642.4871130596429" y="156.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >the agent</text><rect x="547.4871130596429" y="261.0" width="190" height="58" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="642.4871130596429" y="286.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >3. Build</text><text x="642.4871130596429" y="306.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >the agent</text><rect x="305.0" y="336.0" width="190" height="58" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="400.0" y="361.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >4. Verify</text><text x="400.0" y="381.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >agent + scripts</text><rect x="62.51288694035716" y="261.0" width="190" height="58" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="157.51288694035716" y="286.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >5. Review</text><text x="157.51288694035716" y="306.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >other agents</text><rect x="62.51288694035719" y="111.0" width="190" height="58" rx="6" fill="#201c13" stroke="#adaba5" stroke-width="1.5"/><text x="157.5128869403572" y="136.0" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >6. Ship</text><text x="157.5128869403572" y="156.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >scripts</text><text x="400" y="209" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >every change</text><text x="400" y="231" font-size="13" fill="#adaba5" text-anchor="middle" font-weight="400" >walks the same six stages</text><rect x="150" y="437" width="12" height="12" rx="2" fill="none" stroke="#e6c384" stroke-width="2"/><text x="170" y="448" font-size="13" fill="#adaba5" text-anchor="start" font-weight="400" >you decide</text><rect x="330" y="437" width="12" height="12" rx="2" fill="none" stroke="#3fd68a" stroke-width="2"/><text x="350" y="448" font-size="13" fill="#adaba5" text-anchor="start" font-weight="400" >an agent does the work</text><rect x="610" y="437" width="12" height="12" rx="2" fill="none" stroke="#adaba5" stroke-width="2"/><text x="630" y="448" font-size="13" fill="#adaba5" text-anchor="start" font-weight="400" >scripts</text></svg>