<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>A writer's frozen commit goes to a reviewer from a different vendor, then to single-concern reviewers, then agents fix findings and reviewers recheck</title><rect width="800" height="330" fill="#1a170f"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adaba5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd68a"/></marker></defs><rect x="20" y="30" width="170" height="66" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="105.0" y="59.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Writer</text><text x="105.0" y="79.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >model A</text><line x1="190" y1="63" x2="238" y2="63" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="30" width="170" height="66" rx="6" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="325.0" y="59.0" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >Frozen commit</text><text x="325.0" y="79.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >+ requirements</text><line x1="410" y1="63" x2="458" y2="63" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="460" y="30" width="320" height="66" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="620.0" y="59.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Reviewer of another kind</text><text x="620.0" y="79.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >model B, a different vendor</text><text x="620" y="118" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >fits the architecture?  correct?  simpler?</text><line x1="325" y1="96" x2="325" y2="148" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="172" font-size="13" fill="#adaba5" text-anchor="start" font-weight="400" >then reviewers with one concern each</text><rect x="20" y="184" width="98" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="68.80000000000001" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >dead code</text><rect x="127.60000000000001" y="184" width="98" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="176.4" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >test gaps</text><rect x="235.20000000000002" y="184" width="89" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="279.8" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >security</text><rect x="334.40000000000003" y="184" width="56" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="362.20000000000005" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >docs</text><rect x="400.0" y="184" width="123" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="461.4" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >architecture</text><rect x="532.8" y="184" width="98" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="581.5999999999999" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >refactors</text><rect x="640.4" y="184" width="39" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="659.8" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >UI</text><rect x="689.1999999999999" y="184" width="39" height="30" rx="15" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="708.5999999999999" y="204" font-size="13" fill="#eceae5" text-anchor="middle" font-weight="400" >UX</text><line x1="400" y1="214" x2="400" y2="250" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="252" width="320" height="58" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="400.0" y="277.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Fix and recheck</text><text x="400.0" y="297.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >agents fix; reviewers check</text></svg>