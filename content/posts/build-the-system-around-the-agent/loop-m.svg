<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>The software development lifecycle as a loop of six stages</title><rect width="360" height="440" fill="#1a170f"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adaba5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd68a"/></marker></defs><ellipse cx="180" cy="200" rx="88" ry="150" fill="none" stroke="#4a463d" stroke-width="2"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(224.0,70.1) rotate(44.5)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(268.0,200.0) rotate(90.0)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(224.0,329.9) rotate(135.5)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(136.0,329.9) rotate(-135.5)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(92.0,200.0) rotate(-90.0)"/><path d="M-8 -6L6 0L-8 6z" fill="#adaba5" transform="translate(136.0,70.1) rotate(-44.5)"/><rect x="102.0" y="23.0" width="156" height="54" rx="6" fill="#201c13" stroke="#e6c384" stroke-width="1.5"/><text x="180.0" y="46.0" font-size="15" fill="#e6c384" text-anchor="middle" font-weight="700" >1. Define</text><text x="180.0" y="66.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >you</text><rect x="198.0" y="98.00000000000001" width="156" height="54" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="276.0" y="121.00000000000001" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >2. Plan</text><text x="276.0" y="141.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >the agent</text><rect x="198.0" y="248.0" width="156" height="54" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="276.0" y="271.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >3. Build</text><text x="276.0" y="291.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >the agent</text><rect x="102.0" y="323.0" width="156" height="54" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="180.0" y="346.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >4. Verify</text><text x="180.0" y="366.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >agent + scripts</text><rect x="6.0" y="248.0" width="156" height="54" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="84.0" y="271.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >5. Review</text><text x="84.0" y="291.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >other agents</text><rect x="6.0" y="97.99999999999999" width="156" height="54" rx="6" fill="#201c13" stroke="#adaba5" stroke-width="1.5"/><text x="84.0" y="120.99999999999999" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >6. Ship</text><text x="84.0" y="141.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >scripts</text><text x="18" y="406" font-size="12" fill="#e6c384" text-anchor="start" font-weight="400" >amber: you decide</text><text x="18" y="426" font-size="12" fill="#3fd68a" text-anchor="start" font-weight="400" >green: an agent works</text><text x="342" y="426" font-size="12" fill="#adaba5" text-anchor="end" font-weight="400" >grey: scripts</text></svg>