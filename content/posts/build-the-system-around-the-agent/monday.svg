<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Transcript, summary and notebook go to an agent that flags disagreements; I decide; the agent writes the issues</title><rect width="800" height="250" fill="#1a170f"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adaba5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd68a"/></marker></defs><rect x="20" y="30" width="170" height="46" rx="6" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="105.0" y="58.0" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >call transcript</text><path d="M190 53 C 225 53, 220 119, 250 119" fill="none" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="96" width="170" height="46" rx="6" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="105.0" y="124.0" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >its summary</text><path d="M190 119 C 225 119, 220 119, 250 119" fill="none" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="20" y="162" width="170" height="46" rx="6" fill="#201c13" stroke="#4a463d" stroke-width="1.5"/><text x="105.0" y="190.0" font-size="15" fill="#eceae5" text-anchor="middle" font-weight="700" >my notebook</text><path d="M190 185 C 225 185, 220 119, 250 119" fill="none" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="252" y="86" width="140" height="66" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="322.0" y="106.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >The agent</text><text x="322.0" y="125.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >flags what</text><text x="322.0" y="142.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >disagrees</text><line x1="392" y1="119" x2="438" y2="119" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="440" y="86" width="130" height="66" rx="6" fill="#201c13" stroke="#e6c384" stroke-width="1.5"/><text x="505.0" y="106.0" font-size="15" fill="#e6c384" text-anchor="middle" font-weight="700" >Me</text><text x="505.0" y="125.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >I decide</text><text x="505.0" y="142.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >each one</text><line x1="570" y1="119" x2="616" y2="119" stroke="#3fd68a" stroke-width="1.5" marker-end="url(#g)"/><rect x="618" y="76" width="162" height="86" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="699.0" y="106.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Issues</text><text x="699.0" y="125.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >files, what done</text><text x="699.0" y="142.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >looks like, checks</text><text x="400.0" y="232" font-size="13" fill="#adaba5" text-anchor="middle" font-weight="400" >Monday standup in, a week of issues out by lunch</text></svg>