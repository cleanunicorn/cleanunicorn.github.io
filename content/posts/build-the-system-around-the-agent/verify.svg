<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Four gates in a row: tests that ran, screenshots the agent looked at, a staging deploy, acceptance checks</title><rect width="800" height="190" fill="#1a170f"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#adaba5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd68a"/></marker></defs><rect x="20" y="40" width="170" height="84" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="105.0" y="69.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Tests</text><text x="105.0" y="88.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >that ran,</text><text x="105.0" y="105.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >script output</text><text x="105" y="30" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >gate 1</text><line x1="190" y1="82" x2="214" y2="82" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="216" y="40" width="170" height="84" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="301.0" y="69.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Screenshots</text><text x="301.0" y="88.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >the agent took</text><text x="301.0" y="105.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >and looked at</text><text x="301" y="30" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >gate 2</text><line x1="386" y1="82" x2="410" y2="82" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="412" y="40" width="170" height="84" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="497.0" y="78.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Staging</text><text x="497.0" y="98.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >a real deploy</text><text x="497" y="30" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >gate 3</text><line x1="582" y1="82" x2="606" y2="82" stroke="#adaba5" stroke-width="1.5" marker-end="url(#a)"/><rect x="608" y="40" width="170" height="84" rx="6" fill="#201c13" stroke="#3fd68a" stroke-width="1.5"/><text x="693.0" y="69.0" font-size="15" fill="#3fd68a" text-anchor="middle" font-weight="700" >Acceptance</text><text x="693.0" y="88.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >agents +</text><text x="693.0" y="105.0" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >scripts</text><text x="693" y="30" font-size="12" fill="#adaba5" text-anchor="middle" font-weight="400" >gate 4</text><text x="400.0" y="160" font-size="13" fill="#adaba5" text-anchor="middle" font-weight="400" >evidence the agent produces, not claims it makes</text></svg>