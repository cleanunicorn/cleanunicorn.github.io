name: Cathy narration smoke test
on:
  pull_request:
    paths:
      - '.github/workflows/article-audio.yml'
      - '.github/workflows/hugo.yml'
      - 'scripts/article_audio.toml'
      - 'scripts/generate_article_audio.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.2'
      - name: Install Cathy on CPU
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          CATHY_SOURCE="$(python3 scripts/generate_article_audio.py --print-cathy-source)"
          uv tool install --python 3.12 --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match "$CATHY_SOURCE"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Synthesize and validate a short article
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import tempfile
          spec = importlib.util.spec_from_file_location("audio", "scripts/generate_article_audio.py")
          audio = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(audio)
          article = {"key": "posts/smoke/index.md", "title": "Audio check", "html": "<p>This article can now be heard as well as read.</p>"}
          article["fingerprint"] = audio.fingerprint(article)
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              manifest = audio.generate([article], audio.load_settings(), root)
              path = root / "static" / manifest[article["key"]]["url"].lstrip("/")
              assert audio.valid_audio(path), "Cathy failed to produce a playable MP3"
          PY
