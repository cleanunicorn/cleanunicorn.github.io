name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Oslo
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Create directory for user-specific executable files
        run: |
          mkdir -p "${HOME}/.local"
      - name: Install Hugo
        # .hugo-version is the one place the Hugo version is pinned.
        run: |
          HUGO_VERSION="$(tr -d '[:space:]' < .hugo-version)"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
          "${HOME}/.local/hugo/hugo" version
      - name: Install Chromium (for CV PDF generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      - name: Check positioning
        run: make check-positioning
      - name: Check image alt text
        run: make check-alt-text
      - name: Generate CV (HTML + PDF)
        run: make cv-pdf
      - name: Configure Git
        run: |
          git config core.quotepath false
      # The cache holds processed images too (hugo.toml [caches.images]), so the
      # key covers the source images: a new or changed image saves a fresh
      # cache, and restore-keys still restores the previous one to build on.
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('.hugo-version', 'hugo.toml', 'themes/terminal/**', 'content/**/*.png', 'content/**/*.jp*g', 'content/**/*.gif', 'content/**/*.webp', 'assets/**/*.png', 'assets/**/*.jp*g') }}
          restore-keys: |
            hugo-${{ runner.os }}-
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Check build output
        run: make check-build
      - name: Check built metadata
        run: make check-built-meta
      - name: Cache save
        id: cache-save
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5