version: 2
updates:
  # actions/*, lycheeverse/lychee-action and friends in .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # The theme, pinned as the themes/terminal submodule
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
